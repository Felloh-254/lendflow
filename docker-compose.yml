services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: lendflow-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - lendflow
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - CONTAINER_ROLE=app

  nginx:
    image: nginx:1.27-alpine
    container_name: lendflow-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - lendflow
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: lendflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lendflow}
      POSTGRES_USER: ${DB_USERNAME:-lendflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - lendflow-postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    networks:
      - lendflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lendflow} -d ${DB_DATABASE:-lendflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lendflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - lendflow-redis-data:/data
    networks:
      - lendflow
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: lendflow-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - lendflow
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - CONTAINER_ROLE=queue
    command: php artisan queue:work redis --tries=3 --backoff=5

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: lendflow-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - lendflow
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - CONTAINER_ROLE=scheduler
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: lendflow-swagger-ui
    restart: unless-stopped
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    volumes:
      - ./openapi.yaml:/openapi.yaml:ro
    environment:
      SWAGGER_JSON: /openapi.yaml
    networks:
      - lendflow

  frontend:
    image: node:20-alpine
    container_name: lendflow-frontend
    restart: unless-stopped
    profiles: ["frontend"]
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - lendflow

networks:
  lendflow:
    driver: bridge

volumes:
  lendflow-postgres-data:
  lendflow-redis-data:
